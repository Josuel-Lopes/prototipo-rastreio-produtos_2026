<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Alvenius - Rastreio de Produtos e Gerenciamento de Spools por Projeto">
  <title>Rastreio de Produtos | Alvenius</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="stylesheet" href="styles/main.css?v=3.0.0">
  <link rel="stylesheet" href="styles/header.css?v=3.0.0">
  <link rel="stylesheet" href="styles/components.css?v=3.0.0">
  <link rel="stylesheet" href="styles/views.css?v=3.0.0">
  <link rel="stylesheet" href="styles/modals.css?v=3.0.0">
  <link rel="stylesheet" href="styles/proposta.css?v=3.0.0">
  <link rel="stylesheet" href="styles/demo-environment.css?v=3.0.0">
</head>
<body>
  <div id="app">
    <header id="app-header"></header>
    <main id="app-view"></main>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
  </div>

  <!-- Sinalização: Ambiente de demonstração (todas as rotas; oculta na impressão) -->
  <div class="demo-ribbon" role="note"
       aria-label="Ambiente de demonstração. Proposta comercial PROP-2026-011, MAXCODE42 para Alvenius. Dados fictícios.">
    <span class="demo-ribbon__dot" aria-hidden="true"></span>
    <strong class="demo-ribbon__label">Ambiente de demonstração</strong>
    <span class="demo-ribbon__sep" aria-hidden="true">·</span>
    <span class="demo-ribbon__id"><span class="demo-ribbon__desk-inline">Proposta comercial </span>PROP-2026-011</span>
    <span class="demo-ribbon__desk" aria-hidden="true">
      <span class="demo-ribbon__maxcode"><span class="demo-ribbon__sep">·</span> <span class="demo-ribbon__maxcode-text">MAXCODE42 → Alvenius</span></span>
      <span class="demo-ribbon__proposal-only" data-ribbon-version hidden><span class="demo-ribbon__sep">·</span> <span data-ribbon-version-text></span></span>
      <span class="demo-ribbon__demo-only"><span class="demo-ribbon__sep">·</span> Dados fictícios</span>
    </span>
  </div>

  <script type="module" src="app.js?v=3.0.0"></script>
</body>
</html>
