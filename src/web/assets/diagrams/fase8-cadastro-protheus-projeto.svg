<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" width="1080" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Cadastro → Protheus com vínculo de projeto</title>
  <desc id="d">Fluxo App (Cadastro) → API/Integração → Protheus ERP. O envio do código do projeto no payload (azul) e o vínculo gravado no Protheus (verde) são as etapas novas.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0B2545"/>
    </marker>
  </defs>

  <rect width="1080" height="300" fill="#FFFFFF"/>

  <g stroke="#0B2545" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="302" y1="140" x2="406" y2="140"/>
    <line x1="672" y1="140" x2="776" y2="140"/>
  </g>

  <!-- App (existente) -->
  <rect x="40" y="80" width="260" height="120" rx="12" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/>
  <text x="170" y="124" text-anchor="middle" font-size="22" font-weight="700" fill="#0B2545">App · Cadastro</text>
  <text x="170" y="152" text-anchor="middle" font-size="14" fill="#475467">tela de cadastro</text>
  <text x="170" y="172" text-anchor="middle" font-size="14" fill="#475467">(projeto ativo na sessão)</text>

  <!-- API / Integração (novo) -->
  <rect x="410" y="80" width="260" height="120" rx="12" fill="#EEF4FF" stroke="#1F4FD8" stroke-width="3"/>
  <rect x="515" y="62" width="50" height="22" rx="11" fill="#1F4FD8"/>
  <text x="540" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1">NOVO</text>
  <text x="540" y="124" text-anchor="middle" font-size="22" font-weight="700" fill="#0B2545">API / Integração</text>
  <text x="540" y="152" text-anchor="middle" font-size="14" fill="#1F4FD8">envia o código do projeto</text>
  <text x="540" y="172" text-anchor="middle" font-size="14" fill="#1F4FD8">no payload</text>

  <!-- Protheus (novo) -->
  <rect x="780" y="80" width="260" height="120" rx="12" fill="#ECFDF3" stroke="#12B76A" stroke-width="3"/>
  <rect x="885" y="62" width="50" height="22" rx="11" fill="#12B76A"/>
  <text x="910" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#064E3B" letter-spacing="1">NOVO</text>
  <text x="910" y="124" text-anchor="middle" font-size="22" font-weight="700" fill="#0B2545">Protheus ERP</text>
  <text x="910" y="152" text-anchor="middle" font-size="14" fill="#027A48">grava o cadastro com</text>
  <text x="910" y="172" text-anchor="middle" font-size="14" fill="#027A48">vínculo de projeto</text>

  <g font-size="14" fill="#334155">
    <rect x="40" y="244" width="18" height="18" rx="4" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/>
    <text x="68" y="258">Etapa existente</text>
    <rect x="230" y="244" width="18" height="18" rx="4" fill="#EEF4FF" stroke="#1F4FD8" stroke-width="2.5"/>
    <text x="258" y="258">Etapa nova: envio do projeto</text>
    <rect x="490" y="244" width="18" height="18" rx="4" fill="#ECFDF3" stroke="#12B76A" stroke-width="2.5"/>
    <text x="518" y="258">Etapa nova: vínculo no Protheus</text>
  </g>
</svg>
